<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0e1116">
    <title>Ucomms — Sound Messenger</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="app-header">
        <div class="brand">
            <span class="status-dot" id="statusDot" aria-hidden="true"></span>
            <h1>Ucomms</h1>
        </div>
        <div class="header-right">
            <span class="offline-badge" id="offlineBadge" hidden>offline</span>
            <button class="icon-btn" id="settingsBtn" aria-label="Settings" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>

    <section class="settings" id="settingsPanel" hidden>
        <div class="setting-group">
            <label class="setting-label">Sound mode</label>
            <div class="segmented" role="radiogroup" aria-label="Sound mode">
                <button class="seg-btn" data-mode="audible" role="radio">Audible</button>
                <button class="seg-btn" data-mode="ultrasonic" role="radio">Ultrasonic</button>
                <button class="seg-btn" data-mode="silent" role="radio">Silent</button>
            </div>
            <p class="setting-hint" id="modeHint"></p>
        </div>

        <div class="setting-group">
            <label class="setting-row">
                <span class="setting-label">Encryption</span>
                <input type="checkbox" id="encToggle" class="switch">
            </label>
            <div class="code-row" id="codeRow" hidden>
                <input type="text" id="codeInput" class="code-input" inputmode="numeric"
                    maxlength="6" autocomplete="off" placeholder="000000"
                    aria-label="6-digit code, digits 0 to 5 only">
                <p class="setting-hint">6 digits, 0–5 only. Both sides need same code.</p>
            </div>
        </div>

        <div class="setting-group">
            <label class="setting-row">
                <span class="setting-label">Audio visualization</span>
                <input type="checkbox" id="vizToggle" class="switch">
            </label>
        </div>

        <div class="setting-group">
            <button class="danger-btn" id="clearBtn">Clear chat history</button>
        </div>
    </section>

    <div class="viz-wrap" id="vizWrap" hidden>
        <canvas id="vizCanvas" height="160"></canvas>
        <div class="viz-labels">
            <span id="vizBandLabel"></span>
            <span id="vizPeakLabel"></span>
        </div>
    </div>

    <main class="chat" id="chatLog" aria-live="polite"></main>

    <footer class="composer" id="composer">
        <div class="send-progress" id="sendProgress"></div>
        <button class="icon-btn mic-btn" id="listenBtn" aria-label="Toggle listening" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>
        </button>
        <input type="text" id="msgInput" class="msg-input" placeholder="Message…"
            maxlength="120" autocomplete="off" aria-label="Message text">
        <button class="icon-btn send-btn" id="sendBtn" aria-label="Send message">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </footer>

    <div class="toast" id="toast" role="status" hidden></div>

    <script src="js/cipher.js"></script>
    <script src="js/codec.js"></script>
    <script src="js/visualizer.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
